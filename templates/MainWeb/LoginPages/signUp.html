<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../../../static/Assets/styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="icon" type="image/x-icon" href="../../../static/Assets/imgs/favicon.ico">
</head>
<body>
  <header class="headDiv">
    <a href="{{ url_for('home') }}" class="aImg">
      <img src="../../../static/Assets/imgs/projectnevermore.png" alt="Shank's Co." class="imgHead">
    </a>
    <div class="headDivSpacer"></div>
    <h1 class="mainHeader">Shank's Co.</h1>
        <nav class="navigation">
            <ul class="navList">
              <li><a class="a" href="{{ url_for('products') }}">Products</a></li>
              <li><a class="a" href="{{ url_for('about') }}">About</a></li>
              <li><a class="a" href="{{ url_for('contact') }}">Contacts</a></li>
              <li><a class="a" href="{{ url_for('games') }}">Games</a></li>
              <li><a class="a" href="{{ url_for('music') }}">Music</a></li>
              <li><a href="{{ url_for('login') }}"><div class="logIn">Log In!</div></a></li>
              <li><a href="{{ url_for('signup') }}"><div class="signUp">Sign Up!</div></a></li>
              {% if session.get('user_id') %}
                <li><a href="{{ url_for('logout') }}"><div class="logOut">Log Out!</div></a></li>
                <li>{{ session.get('username') }}</li>
              {% endif %}
            </ul>
        </nav>
  </header>
  <main>
    <h2 id="signUpHead">Create Your Account</h2>
    <form id="signupForm" method="POST" action="{{ url_for('signupForm') }}">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      
      <button id="submit" type="submit">Sign Up</button>
      <button id="resendVerificationBtn" type="button" class="secondary">Resend verification email</button>
    </form>
    <div id="error"></div>
  </main>
  <footer class="footDiv">
    <div class="footText">
      <p>Copyright &copy; 2024 Shank's Co. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
